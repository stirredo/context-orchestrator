[project]
name = "context-orchestrator"
version = "0.1.0"
description = "Task-aware context management MCP server for LLMs"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_orchestrator"]
