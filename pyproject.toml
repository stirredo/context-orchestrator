[project]
name = "context-orchestrator"
version = "0.1.0"
description = "Task-aware context management MCP server for LLMs"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "chromadb>=0.5.0",
]

[project.scripts]
save-transcript = "context_orchestrator.cli:main"
transcript-watcher = "context_orchestrator.watcher:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_orchestrator"]
